<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form </title>
    <link
     href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
    rel="stylesheet"
    />
</head>
<body>
     <div class="container">
        <h2>Form Demo </h2>
        <div class="row">
            <div class="mb-3 col-md-6">
                <label class="form-label" for="Email">Email</label>
                <input type="text" class="form-control" placeholder="Email" id="Email">
           </div>
           <div class="mb-3 col-md-6">
                <label for="password" class="form-label">Password </label>
                <input class="form-control" type="password" placeholder="Password" id="password">
            </div>

        </div>
        <div class="mb-3">
            <label for="Address " class="form-label">Address</label>
            <input class="form-control" type="Address " placeholder="Address " id="Address ">
        </div>
        <div class="mb-3">
            <select class="form-select">
                <option selected>Choose your city</option>
                <option value="1">Mumbia</option>
                <option value="2">Dlehi </option>
                <option value="3">Pune</option>
            </select>
        </div>
        <div class="normal mb-3">
            <input type="checkbox" id="agrees">
            <label for="agrees">Agree</label>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" id="agree" class="form-check-input">
            <label for="agree" class="form-check-label">Agree</label>
        </div>

        <div class="mb-3 form-check">
            <input type="radio" id="radio" class="form-check-input">
            <label for="radio" class="form-check-label">Yes/No</label>
        </div>

        <div class="mb-3 form-check form-switch">
             <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
            <label class="form-check-label" for="switchCheckDefault">Dark/light</label>
        </div>
     </div>
</body>
</html>

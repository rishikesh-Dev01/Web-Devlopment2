<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox</title>
</head>
<body>
    <form action="/server">
        
        <div>
            <input type="radio" name="fruit" id="apple" value="apple">
            <label for="apple">Apple</label>
        </div>
        <div>
            <input type="radio" name="fruit" id="mango" value="mango">
            <label for="mango">Mango</label>
        </div>
        <div>
            <input type="radio" name="fruit" id="Orange" value="mango">
            <label for="Orange">Orange</label>
        </div>
        <br>

        <div>
            choose your subjects : 
            <input type="checkbox" id="maths" name="sub" value="math">
            <label for="maths">Math</label>
            <input type="checkbox" id="Science" name="sub" value="sci" >
            <label for="Science">Science</label>
            <input type="checkbox" id="English" name="sub" value="eng">
            <label for="English">English</label>
        </div>

        <div>
            choose your profession 
            <select name="profession" id="profession">
                <option>Select your option</option>
                <option value="student" selected>student</option>
                <option value="dev">Developer</option>
            </select>
        </div>

        <label for="vol">select your volume</label>
        <input type="range" id="vol" min="0" max="100" name="vol" step="10" value="76"/>

        <br>
         <label for="feedback">Please provide your valuable feedack : </label>
        <textarea id="feedback" name="feedack" placeholder="Write your feedback here"></textarea>
        <button>Submit</button>
    </form>
</body>
</html>

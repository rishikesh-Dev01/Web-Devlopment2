<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav>
            <div class="left">Kandan</div>
            <div class="right"><button id="toggle-modal">Add new Task</button></div>
        </nav>
        <section class="board">
            <div class="task-colum" id="todo">
                <div class="heading">
                    <div class="left">To Do </div>
                    <div class="right">Count </div>
                </div>
                 <div draggable="true"class="task">
                    <h2>Task 1</h2>
                    <p>Description for Task 1</p>
                    <button>Delete</button>
                </div>
            </div>
            <div class="task-colum" id="Progress">
                <div class="heading">
                    <div class="left">In Progress </div>
                    <div class="right">Count </div>
                </div>
               
            </div>
            <div class="task-colum" id="Done">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right">Count</div>
                </div>
            </div>
        </section>
    </main>

    <div class="modal add-new-task">
        <div class="bg"></div>
        <div class="center">
            <input type="text" placeholder="Task Title">
            <textarea placeholder="Task Description"></textarea>
            <button id="add-new-task" class="add-task-btn">Add Task</button>

        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>

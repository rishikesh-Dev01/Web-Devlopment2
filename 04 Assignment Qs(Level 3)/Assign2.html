<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recreate form </title>
</head>
<body>
     <form action="/action">
        <div>
            <label for="user">Name : </label>
            <input type="text" placeholder="Enter Name" name="user" id="user">
        </div>
        <br>
        <div>
            <label for="gender">Sex : </label>
            <input type="radio" placeholder="Male" id="M" name="gender">
            <label for="M">Male</label>
            <input type="radio" placeholder="Female" id="F" name="gender">
            <label for="F">Female</label>
        </div>
        <br>
        <div>
            <label for="country">Country : </label>
            <select>
            <option>Select an option</option>
            <option value="I">India</option>
            <option value="N">Nepal</option>
            <option value="U">USA</option>
            <option value="C">Canada</option>
        </select>
        </div>
        <br>
        <div>
            <label for="text">Message : </label>
            <br>
            <textarea name="text" id="text" rows="4" cols="30"></textarea>
        </div>
        <br>
        <div>
            <input type="checkbox" name="check " id="check">
            <label for="check">Subscribe?</label>
        </div>
        <br>
        <button>Submit</button>
     </form>
</body>
</html>

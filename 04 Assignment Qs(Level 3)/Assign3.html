<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recreate form </title>
</head>
<body>
    <form action="/server">
        <h2>Feedback Form</h2>
        <div>
            <label for="stu ">Name : </label>
            <input type="text" placeholder="Write your name" name="Stu " id="stu ">
        </div>
        <br>
        <div>
            <label for="mail">Email : </label>
            <input type="text" placeholder="Write your Email" name="mail" id="mail">

        </div>

        <br>
        <div>
            <label for="Feed">Message : </label>
            <br>
           <textarea name="Feed " id="Feed" cols="30" rows="4">write your opinion</textarea>
        </div>

        
        <div>
            <label for="rating">Rate us our of 5:</label><br>
            <input type="radio" name="one" id="one">
            <label for="one">1</label>
        </div>
        <div>
            <input type="radio" name="two" id="two">
            <label for="two">2</label>

        </div>
        <div>
            <input type="radio" name= "three" id= "three">
            <label for= "three">3</label>

        </div>
        <div>
            <input type="radio" name="four" id="four">
            <label for="four">4</label>

        </div>
        <div>
            <input type="radio" name="five" id="five">
            <label for="five">5</label>

        </div>
        <br>
        <button>Send your message!</button>
    </form>
</body>
</html>
